name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache is disabled to avoid "Dependencies lock file is not found" error

      - name: Install Dependencies
        # --legacy-peer-deps avoids the npm v10 Arborist "edgesOut of null" bug when resolving dependency tree
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
